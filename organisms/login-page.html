<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/slick.css">
    <link rel="stylesheet" href="../assets/css/slick-theme.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- styles -->

    <!-- fav-icons -->
    <link rel="shortcut icon" href="/favicon.ico"/>
    <link rel="icon" href="/favicon.ico" type="image/x-icon"/>
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png"/>
    
    <title>*SCAPE</title>
  </head>
  <body>
    <!-- body content start -->

    <div class="sc-login">
        <header class="sc-login__header">
            <div class="sc-login__logo">
                <img src="../assets/images/scape-logo-new.png" alt="">
            </div>
        </header>
    
        <div class="container">
            <div class="sc-login__outer">
                <main class="sc-login__maincontent">
                    <div class="sc-login__decorativeelements"></div>
                    <div class="sc-login__logincontainer">
                        <!-- email -->
                        <h1 class="sc-login__logintitle">LOGIN / SIGN UP</h1>
                        <input type="email" class="sc-login__emailinput" placeholder="Email address">
                        <!-- password -->
                        <h1 class="sc-login__logintitle">PASSWORD</h1>
                        <input type="password" class="sc-login__passwrd" placeholder="Password">
                        <!-- <p class="info-text">A one-time password will be sent to your email.</p> -->
                        <button class="sc-login__loginbutton">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 8H15M15 8L8 1M15 8L8 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            LOGIN / SIGN UP
                        </button>
                    </div>
                </main>
            </div>
        </div>
    
        <footer class="sc-login__footer">
            <div>© Copyright 2025, *SCAPE CO., Ltd. All Rights Reserved.</div>
            <div class="sc-login__tandc">
                <a href="#">Terms of Use</a>
                <a href="#">Contact us</a>
            </div>
        </footer>
    </div>

    <!-- body content end -->

    <!-- scripts -->
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>
    <!-- scripts -->
  </body>
</html>
