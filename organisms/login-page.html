<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/slick.css">

    <title>Document</title>

  <body>
    <!-- body content start -->

    <div class="sc-login">
        <header class="sc-login__header">
            <div class="sc-login__logo">SCAPE</div>
        </header>
    
        <main class="sc-login__maincontent">
            <div class="sc-login__decorativeelements"></div>
            <div class="sc-login__logincontainer">
                <!-- email -->
                <h1 class="sc-login__logintitle">LOGIN / SIGN UP</h1>
                <input type="email" class="sc-login__emailinput" placeholder="Email address">
                <!-- password -->
                <h1 class="sc-login__logintitle">PASSWORD</h1>
                <input type="password" class="sc-login__passwrd" placeholder="Password">
                <!-- <p class="info-text">A one-time password will be sent to your email.</p> -->
                <button class="sc-login__loginbutton">
                    LOGIN / SIGN UP
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 8H15M15 8L8 1M15 8L8 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </main>
    
        <footer class="sc-login__footer">
            <div>© Copyright 2025, *SCAPE CO., Ltd. All Rights Reserved.</div>
            <div>
                <a href="#">Terms of Use</a>
                <a href="#">Contact us</a>
            </div>
        </footer>
    </div>

    <!-- body content end -->

    <!-- scripts -->
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
