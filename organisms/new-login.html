<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/slick.css">
    <link rel="stylesheet" href="../assets/css/slick-theme.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- styles -->
    <title>*SCAPE</title>
  </head>
  <body>
    <!-- body content start -->
     <div class="sc-nwlogin">
      <!-- left img -->
       <div class="sc-nwlogin__left">
        <div class="sc-nwlogin__leftimg">
          <img src="../assets/images/login-left.png" alt="img">
        </div>
       </div>
       <!-- right form -->
       <div class="sc-nwlogin__right" style="background-image: url('../assets/images/login-form_bg.png');">
        <div class="sc-nwlogin__scapelogo">
          <img src="../assets/images/scape-logo.png" alt="img">
        </div>
        <div class="sc-login__logincontainer">
          <!-- email -->
          <h1 class="sc-login__logintitle">Login</h1>
          <input type="email" class="sc-login__emailinput" placeholder="Email your email address">
          <!-- password -->
          <input type="password" class="sc-login__passwrd" placeholder="Enter your password">
          <a href="#" class="sc-login__forgetpwd">Forgot password!</a>
          <!-- <p class="info-text">A one-time password will be sent to your email.</p> -->
          <button class="sc-login__loginbutton">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 8H15M15 8L8 1M15 8L8 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
              LOGIN / SIGN UP
          </button>
      </div>
      <p class="sc-nwlogin__footertxt">© Copyright 2024, *SCAPE Co., Ltd. All Rights Reserved.</p>
       </div> 
     </div>
    <!-- body content end -->

    <!-- scripts -->
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>
    <!-- scripts -->
  </body>
</html>
