<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <!-- styles -->
    
    <title>*SCAPE</title>
  </head>
  <body>
    <!-- body content start -->

    <div class="overflow-hidden">
        <div class="d-flex align-items-center sc-info__header">
          <header class="container d-flex justify-content-between">
            <div class="sc-info__logo">
                <a href="https://scape.sg/myaccount/" target="_blank">
                  <img class="w-100" src="../assets/images/scape-logo-new.png" alt="">
                </a>
            </div>
            <div class="dropdown sc-info__dropdown">
              <button class="btn dropdown-toggle border-0" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                <img src="../assets/images/user.png" alt="Profile Icon" width="30" height="30"> 
              </button>
              <ul class="dropdown-menu dropdown-menu-left" aria-labelledby="dropdownMenuButton">
                <li><a class="dropdown-item" href="#">MY ACCOUNT</a></li>
                <li><a class="dropdown-item" href="#">LOGOUT</a></li>
              </ul>
            </div>
        </header>
        </div>
    
        <section class="d-flex sc-info">
            <div class="sc-info__left">
              <img class="" src="../assets/images/singpass-leftimg-top.png" alt="">
            </div>
            <div class="sc-info__event">
              <div class="sc-info__eventleft">
                <div class="sc-info__eventimg">
                  <img src="../assets/images/event-img.png" alt="">
                </div>
                <h2 class="sc-info__eventtxt1">EVENT</h2>
                <h2 class="sc-info__eventtxt2">Production Testing - Event</h2>
              </div>
              <div class="sc-info__ty sc-info__box">
                <h3 class="fw-bold">Thank you</h3>
                <p class="sc-info__para">The following information is retrieved from MyInfo-SingPass</p>
                <form>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput" placeholder="Name">
                    <label for="floatingInput">Name</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingMobileNumber" placeholder="Mobile Number">
                    <label for="floatingMobileNumber">Mobile Number</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingDateofbirth" placeholder="Dateofbirth">
                    <label for="floatingDateofbirth">Date of Birth</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingNRIC" placeholder="NRIC">
                    <label for="floatingNRIC">NRIC</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingResidentialStatus" placeholder="Residential Status">
                    <label for="floatingResidentialStatus">Residential Status</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingSex" placeholder="Sex">
                    <label for="floatingSex">Sex</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingRace" placeholder="Race">
                    <label for="floatingRace">Race</label>
                  </div>
                  <h5 class="my-3">Address</h5>
                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingBlock" placeholder="Block">
                        <label for="floatingBlock">Block</label>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingBuildingName" placeholder="Building Name">
                        <label for="floatingBuildingName">Building Name</label>
                      </div>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-md-12"> 
                      <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingStreet" placeholder="Street">
                        <label for="floatingStreet">Street</label>
                      </div>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingFloor" placeholder="Floor">
                        <label for="floatingFloor">Floor</label>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingUnit" placeholder="Unit">
                        <label for="floatingUnit">Unit</label>
                      </div>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingCountry" placeholder="Country">
                        <label for="floatingCountry">Country</label>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingPostalcode" placeholder="Postal code">
                        <label for="floatingPostalcode">Postal code</label>
                      </div>
                    </div>
                  </div>
                  <button class="sc-info__nextbutton">
                    <svg width="25" height="12" viewBox="0 0 25 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path fill-rule="evenodd" clip-rule="evenodd" d="M16.6436 0.3538L23.8036 7.5038L24.1577 7.85735L23.8039 8.21115L16.6439 15.3712L15.9367 14.664L22.231 8.36977L0.00292882 8.49999L-0.00292964 7.50001L22.254 7.36961L15.937 1.0614L16.6436 0.3538Z" fill="black"/>
                      </svg>
                    Next
                  </button>
                </form>

              </div>
            </div>
            <div class="sc-info__right">
              <img class="" src="../assets/images/singpass-rightimg-top.png" alt="">
            </div>
        </section>
    
        <footer class="sc-info__footer w-100 d-flex align-items-center justify-content-between">
            <div>© Copyright 2025, *SCAPE CO., Ltd. All Rights Reserved.</div>
            <div class="d-flex gap-3">
              <a href="https://www.scape.sg/terms-of-use/" target="_blank">Terms of Use</a>
              <a href="https://www.scape.sg/contact-us/" target="_blank">Contact us</a>
            </div>
        </footer>
    </div>

    <!-- body content end -->

    <!-- scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <!-- scripts -->
  </body>
</html>
