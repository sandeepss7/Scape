<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/slick.css">
    <link rel="stylesheet" href="../assets/css/slick-theme.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <!-- styles -->

    <!-- fav-icons -->
    <link rel="shortcut icon" href="/favicon.ico"/>
    <link rel="icon" href="/favicon.ico" type="image/x-icon"/>
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png"/>
    
    <title>*SCAPE</title>
  </head>
  <body>
    <!-- body content start -->

    <div class="overflow-hidden">
        <div class="d-flex align-items-center sc-info__header">
          <header class="container">
            <div class="sc-info__logo">
                <img class="w-100" src="../assets/images/scape-logo-new.png" alt="">
            </div>
        </header>
        </div>
    
        <section class="d-flex sc-info">
            <div class="sc-info__left">
              <img class="h-100" src="../assets/images/singpass-leftimg.png" alt="">
            </div>
            <div class="position-relative overflow-auto sc-info__content">
              <div class="sc-info__ty sc-info__box">
                <h3 class="fw-bold">Thank you</h3>
                <p class="sc-info__para">The following information is retrieved from MyInfo-Sin<span class="fw-bold">gPass</span></p>
                <form>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput" placeholder="">
                    <label for="floatingInput">Principal Name</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="date" class="form-control" id="floatingDateofbirth" placeholder="Dateofbirth">
                    <label for="floatingDateofbirth">Date of Birth</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingNRIC" placeholder="NRIC">
                    <label for="floatingNRIC">NRIC</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingResidentialStatus" placeholder="Residential Status">
                    <label for="floatingResidentialStatus">Residential Status</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingSex" placeholder="Sex">
                    <label for="floatingSex">Sex</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingRace" placeholder="Race">
                    <label for="floatingRace">Race</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingRegisteredaddress" placeholder="Registered address">
                    <label for="floatingRegisteredaddress">Registered Address</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="number" class="form-control" id="floatingMobileNumber" placeholder="Mobile Number">
                    <label for="floatingMobileNumber">Mobile Number</label>
                  </div>
                  <button class="sc-info__nextbutton">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 8H15M15 8L8 1M15 8L8 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    Next
                </button>
                </form>

              </div>
            </div>
            <div class="sc-info__right">
              
              <img class="h-100" src="../assets/images/singpass-rightimg.png" alt="">
            </div>
        </section>
    
        <footer class="sc-info__footer w-100 d-flex align-items-center justify-content-between">
            <div>© Copyright 2025, *SCAPE CO., Ltd. All Rights Reserved.</div>
            <div class="d-flex gap-3">
                <a href="#">Terms of Use</a>
                <a href="#">Contact us</a>
            </div>
        </footer>
    </div>

    <!-- body content end -->

    <!-- scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>
    <!-- scripts -->
  </body>
</html>
